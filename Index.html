<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f6f5f1; --surface:#fcfcfb; --card:#ffffff; --line:#e4e2db; --line2:#d2cfc6;
  --ink:#1c1b19; --ink2:#52514e; --ink3:#7d7b75;
  --brand:#b3122a;
  --primary:#1f2a44; --primary-ink:#fff;
  --s-sup:#2a78d6; --s-peer:#eb6834; --s-sub:#1baf7a; --s-self:#eda100; --s-360:#6250d6;
  --good:#1f7a3a; --good-bg:#e6f3ea; --warn:#9a6200; --warn-bg:#fdf1db; --bad:#b42318; --bad-bg:#fdeceb;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
.wrap.wide{max-width:1180px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
.logo{width:36px;height:36px;border-radius:9px;display:block;flex:none}
.top .t1{font-weight:600;font-size:15px;line-height:1.2}
.top .t2{font-size:12.5px;color:var(--ink3)}
.top .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card.flat{background:var(--surface)}
h1{font-size:22px;margin:0 0 4px;font-weight:600;line-height:1.3}
h2{font-size:17px;margin:0 0 10px;font-weight:600}
h3{font-size:15px;margin:0 0 8px;font-weight:600}
.muted{color:var(--ink2)} .small{font-size:13px} .xs{font-size:12px;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;min-height:40px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.input{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
.input:focus,textarea:focus{outline:2px solid #9ec5f4;border-color:var(--s-sup)}
textarea.input{min-height:96px;resize:vertical}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:500;background:#f0eee8;color:var(--ink2);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.rel-SELF{background:#fdf3dc;color:#7a5300} .chip.rel-SUP{background:#e3eefb;color:#1c5cab} .chip.rel-PEER{background:#fdebe3;color:#a8431a} .chip.rel-SUB{background:#e2f5ed;color:#0f6e4b}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.bar{height:8px;background:#ecebe5;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar.good>i{background:var(--good)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.hero{background:var(--primary);color:#fff;border:none}
.hero .muted,.hero .xs{color:#c9d0e0}
.hero .bar{background:rgba(255,255,255,.18)} .hero .bar>i{background:#fff}
.task{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.task.done{background:var(--surface)}
.av{width:42px;height:42px;border-radius:50%;background:#ecebe5;display:grid;place-items:center;font-weight:600;color:var(--ink2);flex:none;font-size:15px}
.task .nm{font-weight:600;line-height:1.3}
.check{width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
/* form */
.steps{display:flex;gap:3px;margin:8px 0 18px}
.steps i{flex:1;height:5px;border-radius:9px;background:#e2e0d9}
.steps i.on{background:var(--primary)} .steps i.cur{background:var(--s-sup)}
.pillar{font-size:12.5px;font-weight:600;color:var(--brand);letter-spacing:.2px}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:none}
.qt{font-weight:500;margin-bottom:10px}
.qt b{color:var(--ink3);font-weight:500;margin-right:4px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sc{border:1.5px solid var(--line2);background:#fff;border-radius:10px;padding:7px 2px 6px;cursor:pointer;text-align:center;min-height:56px}
.sc .n{font-size:18px;font-weight:600;line-height:1.1;display:block}
.sc .l{font-size:10.5px;color:var(--ink3);line-height:1.2;display:block;margin-top:2px}
.sc:hover{border-color:var(--ink3)}
.sc.sel{background:var(--primary);border-color:var(--primary);color:#fff}
.sc.sel .l{color:#d6dbe8}
.na{margin-top:7px;border:1px dashed var(--line2);background:transparent;border-radius:8px;padding:3px 10px;font-size:12.5px;color:var(--ink3);cursor:pointer}
.na.sel{background:#ecebe5;border-style:solid;color:var(--ink)}
.navbar{position:fixed;left:0;right:0;bottom:0;background:rgba(252,252,251,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20}
.navbar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.legend5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.legend5 div{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px;text-align:center;font-size:12px}
.legend5 b{display:block;font-size:16px}
/* HR */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 14px;border:none;background:none;cursor:pointer;font-weight:500;color:var(--ink2);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--primary)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:26px;font-weight:600;line-height:1.15}
.kpi .k{font-size:12.5px;color:var(--ink2)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:13.5px}
th{font-size:12px;color:var(--ink2);font-weight:600;background:var(--surface);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.tbl table tr:last-child td{border-bottom:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:7px 12px;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--primary);color:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto;min-height:38px;padding:7px 10px}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:#6b4400}
.banner.info{background:#e8f0fb;color:#1c4a85}
/* report */
.rep{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:18px}
.rep-head{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.score-big{font-size:40px;font-weight:600;line-height:1}
.score-big small{font-size:16px;color:var(--ink3);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:4px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.dash{height:0;border-top:2.5px dashed var(--s-self);border-radius:0;width:16px}
.cmt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:14px}
.gap-pos{color:#9a6200;font-weight:600} .gap-neg{color:#1c5cab;font-weight:600}
.person-list{display:flex;flex-direction:column;gap:2px;max-height:640px;overflow:auto}
.pl{display:flex;justify-content:space-between;gap:8px;align-items:center;border:none;background:none;text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer}
.pl:hover{background:#f0eee8} .pl.on{background:var(--primary);color:#fff} .pl.on .xs{color:#c9d0e0}
.rep-layout{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.modal-bg{position:fixed;inset:0;background:rgba(20,20,18,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.demo{position:fixed;right:10px;top:10px;z-index:40;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.12);font-size:13px;max-width:300px}
.demo b{color:var(--brand)}
.demo .body{display:none;margin-top:6px}.demo.open .body{display:block}.demo .hd{cursor:pointer;user-select:none}
.demo select{width:100%;margin:6px 0;border:1px solid var(--line2);border-radius:8px;padding:5px}
.spin{width:28px;height:28px;border:3px solid #ddd;border-top-color:var(--primary);border-radius:50%;animation:sp 0.8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
#print-area{display:none}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.rep-layout{grid-template-columns:1fr}.person-list{max-height:220px}}
@media (max-width:420px){.sc .l{font-size:9.5px}.wrap{padding:12px 12px 120px}}
@media print{
  body{background:#fff}
  #app,.demo,.toast,.modal-bg{display:none!important}
  #print-area{display:block}
  .rep{border:none;padding:0;margin:0;page-break-after:always;break-after:page}
  .rep:last-child{page-break-after:auto}
  .grid2{grid-template-columns:1fr 1fr}
  @page{size:A4;margin:12mm}
}

          'บันทึกข้อมูลลูกค้าและรายงานผลถูกต้อง ครบถ้วน ทันเวลา',
          'ทำงานตามกติกาการแบ่งลูกค้ากับเซลส์ ไม่เกิดความขัดแย้งเรื่องลูกค้า'] },

  var OPEN_Q = [

    { key: 'improve', label: 'สิ่งที่อยากให้เขา “ทำเพิ่ม/ปรับ” เพื่อให้ดีขึ้น 1–2 เรื่อง', self: 'สิ่งที่ฉันอยากทำเพิ่ม/ปรับ 1–2 เรื่อง' },
    { key: 'other', label: 'ความเห็นอื่น ๆ (ถ้ามี)', self: 'ความเห็นอื่น ๆ (ถ้ามี)' }
  ];
  var SCALE = [
    { v: 1, label: 'ต้องปรับปรุงเร่งด่วน', hint: 'แทบไม่เห็นพฤติกรรมนี้' },
    { v: 2, label: 'ควรพัฒนา', hint: 'ทำบ้างเป็นบางครั้ง' },
    { v: 3, label: 'ตามที่คาดหวัง', hint: 'ทำได้เป็นส่วนใหญ่' },
    { v: 4, label: 'ดี', hint: 'ทำได้สม่ำเสมอ' },
    { v: 5, label: 'โดดเด่น', hint: 'ทำเป็นประจำจนเป็นแบบอย่างให้คนอื่น' }
  ];
  var BANDS = [
    { key: 'ready', label: 'พร้อมเติบโต', note: '≥ 4.00 และไม่มีหมวดใดต่ำกว่า 3.00 · พร้อมขึ้นระดับถัดไป' },
    { key: 'develop', label: 'พัฒนาต่อ', note: '3.50–3.99 · พัฒนา 3–6 เดือนแล้วทบทวน' },
    { key: 'notready', label: 'ยังไม่พร้อม', note: '< 3.50 · เน้นพัฒนาในตำแหน่งปัจจุบัน' }
  ];
  var ITEM_KEYS = [];
  ['A', 'B', 'C', 'D', 'E'].forEach(function (c) { [1, 2, 3].forEach(function (i) { ITEM_KEYS.push(c + i); }); });

  function formOf(role) { return role === 'SPEC' ? 'SPEC' : 'MGMT'; }
  function rosterObjects() {
    return ROSTER.map(function (r) {
      return { id: r[0], name: r[1], nick: r[2], branch: r[3], role: r[4], team: r[5], active: true, pin: '' };
    });
  }
  function displayName(e) { return e ? (e.name + (e.nick ? ' (' + e.nick + ')' : '')) : '-'; }
  function roleLabel(e) { return ROLES[e.role] || e.role; }

  /* เลือกเพื่อนร่วมงานแบบหมุนเวียน: คนที่ i ได้รับการประเมินจากคนที่ i+1..i+k
     ทุกคนจึงประเมินเพื่อน k คน และถูกเพื่อนประเมิน k คนเท่ากัน */
  function rotatePeers(group, k) {
    var out = [], n = group.length; k = Math.min(k, n - 1);
    group.forEach(function (r, i) { for (var j = 1; j <= k; j++) out.push([group[(i + j) % n], r]); });
    return out;
  }

  /* ===== สร้างคู่ประเมินอัตโนมัติ =====
     หัวหน้าทีม   ← ผจก./ผช.ผจก.สาขา · หัวหน้าทีมคนอื่น (หมุนเวียน 3 คน) · ลูกทีมในทีม · ตนเอง
     ผจก./ผช.ผจก. ← GM · ผจก./ผช.ผจก.คนอื่น (หมุนเวียน 3 คน) · หัวหน้าทีม+พนักงานในสาขา · ตนเอง
     GM           ← ผู้บริหารสูงสุด · ผจก./ผช.ผจก.ทุกคน + ทีมในสาขาของ GM · ตนเอง
     สายเฉพาะทาง ← หัวหน้าสาขา (หรือ GM) · เพื่อนสายเฉพาะทาง (หมุนเวียน) · หน่วยงานร่วม (HR เพิ่มเองในชีต) · ตนเอง */
  function generateAssignments(emps, opt) {
    opt = opt || {};
    var k = Number(opt.maxPeers || 3);
    var act = emps.filter(function (e) { return e.active; });
    var out = [], seen = {};
    function add(rater, ratee, rel) {
      if (!rater || !ratee) return;
      var key = rater.id + '>' + ratee.id;
      if (seen[key]) return;
      seen[key] = 1;
      out.push({ raterId: rater.id, rateeId: ratee.id, rel: rel });
    }
    function head(branch) {
      var c = act.filter(function (e) { return e.branch === branch && (e.role === 'MGR' || e.role === 'AM' || e.role === 'GM'); });
      c.sort(function (a, b) { return ROLE_RANK[b.role] - ROLE_RANK[a.role]; });
      return c[0];
    }
    var byBranch = function (a, b) { return BRANCH_ORDER.indexOf(a.branch) - BRANCH_ORDER.indexOf(b.branch) || (a.team < b.team ? -1 : 1); };
    var gm = act.filter(function (e) { return e.role === 'GM'; })[0];
    var exec = act.filter(function (e) { return e.role === 'EXEC'; })[0];
    var mgrs = act.filter(function (e) { return e.role === 'MGR' || e.role === 'AM'; }).sort(byBranch);
    var tls = act.filter(function (e) { return e.role === 'TL'; }).sort(byBranch);
    var specs = act.filter(function (e) { return e.role === 'SPEC'; }).sort(byBranch);

    act.forEach(function (r) {
      if (RATEE_ROLES.indexOf(r.role) < 0) return;
      add(r, r, 'SELF');
      if (r.role === 'TL') {
        add(head(r.branch) || gm, r, 'SUP');
        act.forEach(function (s) { if (s.role === 'STAFF' && s.branch === r.branch && (s.team || '') === (r.team || '')) add(s, r, 'SUB'); });
      } else if (r.role === 'MGR' || r.role === 'AM') {
        add(gm, r, 'SUP');
        act.forEach(function (s) { if ((s.role === 'TL' || s.role === 'STAFF') && s.branch === r.branch) add(s, r, 'SUB'); });
      } else if (r.role === 'GM') {
        add(exec, r, 'SUP');
        mgrs.forEach(function (s) { add(s, r, 'SUB'); });
        act.forEach(function (s) { if ((s.role === 'TL' || s.role === 'STAFF') && s.branch === r.branch) add(s, r, 'SUB'); });
      } else if (r.role === 'SPEC') {
        add(head(r.branch) || gm, r, 'SUP');
      }
    });
    [tls, mgrs, specs].forEach(function (g) { rotatePeers(g, k).forEach(function (p) { add(p[0], p[1], 'PEER'); }); });
    return out;
  }

  function mean(a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : null; }
  function r2(x) { return x == null ? null : Math.round(x * 100) / 100; }

  /* คะแนนรายหมวด (1–5) ของแบบประเมิน 1 ชุด — N/A (0/ว่าง) ไม่นำมาคิด */
  function catScores(answers) {
    return ['A', 'B', 'C', 'D', 'E'].map(function (c) {
      var v = [];
      [1, 2, 3].forEach(function (i) { var x = Number(answers[c + i]); if (x >= 1 && x <= 5) v.push(x); });
      return mean(v);
    });
  }
  function overall(cats) { return mean(cats.filter(function (x) { return x != null; })); }
  function bandOf(score, cats) {
    if (score == null) return null;
    var minCat = Math.min.apply(null, cats.filter(function (x) { return x != null; }));
    if (score >= 4 && minCat >= 3) return BANDS[0];
    if (score >= 3.5) { var b = BANDS[1]; return score >= 4 ? { key: b.key, label: b.label, note: 'คะแนนรวม ≥ 4.00 แต่มีหมวดต่ำกว่า 3.00 · ' + b.note } : b; }
    return BANDS[2];
  }

  /* ===== สถานะการประเมิน ===== */
  function status(emps, asg, resps) {
    var done = {}; resps.forEach(function (r) { done[r.raterId + '>' + r.rateeId] = r.ts || true; });
    var raters = {}, ratees = {};
    asg.forEach(function (a) {
      var d = !!done[a.raterId + '>' + a.rateeId];
      (raters[a.raterId] = raters[a.raterId] || { id: a.raterId, total: 0, done: 0, pending: [] });
      raters[a.raterId].total++; if (d) raters[a.raterId].done++; else raters[a.raterId].pending.push(a.rateeId);
      (ratees[a.rateeId] = ratees[a.rateeId] || { id: a.rateeId, total: 0, done: 0, byRel: {} });
      ratees[a.rateeId].total++; if (d) ratees[a.rateeId].done++;
      var br = ratees[a.rateeId].byRel[a.rel] = ratees[a.rateeId].byRel[a.rel] || { total: 0, done: 0 };
      br.total++; if (d) br.done++;
    });
    var doneA = asg.filter(function (a) { return done[a.raterId + '>' + a.rateeId]; }).length;
    return { raters: raters, ratees: ratees, total: asg.length, done: doneA };
  }

  /* ===== สรุปผลรายบุคคล =====
     - คะแนนกลุ่ม = เฉลี่ยของผู้ตอบในกลุ่ม · คะแนนถ่วงน้ำหนัก = Σ(น้ำหนัก × กลุ่ม) / Σน้ำหนักของกลุ่มที่มีข้อมูล
     - ไม่รวมการประเมินตนเอง · ลูกน้องตอบน้อยกว่า MIN_SUB_N (3) คน → รวมกับกลุ่มเพื่อน (รวมน้ำหนักด้วย)
     - กลุ่มเพื่อน/ลูกน้อง/หน่วยงานร่วม ที่มีผู้ตอบน้อยกว่า MIN_GROUP_N (2) คน ไม่แสดงแยก แต่ยังนับในคะแนน */
  function aggregate(emps, asg, resps, cfg) {
    cfg = cfg || {};
    var minN = Number(cfg.MIN_GROUP_N || 2), minSub = Number(cfg.MIN_SUB_N || 3);
    var relOf = {}, expected = {};
    asg.forEach(function (a) { relOf[a.raterId + '>' + a.rateeId] = a.rel; (expected[a.rateeId] = expected[a.rateeId] || {})[a.rel] = 1; });
    var res = {}, lists = {};
    emps.filter(function (e) { return RATEE_ROLES.indexOf(e.role) >= 0 && e.active; }).forEach(function (e) {
      res[e.id] = { id: e.id, form: formOf(e.role), groups: {}, comments: { strength: [], improve: [], other: [] }, selfComments: null, merged: false };
      lists[e.id] = { SELF: [], SUP: [], PEER: [], SUB: [], PARTNER: [] };
    });
    resps.forEach(function (r) {
      var rel = relOf[r.raterId + '>' + r.rateeId] || r.rel;
      if (!res[r.rateeId] || !lists[r.rateeId][rel]) return;
      lists[r.rateeId][rel].push({ cats: catScores(r.answers), r: r });
    });
    Object.keys(res).forEach(function (id) {
      var R = res[id], L = lists[id], F = FORMS[R.form];
      // ใช้น้ำหนักเฉพาะกลุ่มที่มีคู่ประเมินจริง (เช่น GM ไม่มีกลุ่มเพื่อน → แบ่งน้ำหนักให้หัวหน้า/ลูกน้อง)
      var W = {}, ex = expected[id] || {}; Object.keys(F.weights).forEach(function (k) { if (ex[k]) W[k] = F.weights[k]; });
      if (L.SUB.length > 0 && L.SUB.length < minSub) {
        L.PEER = L.PEER.concat(L.SUB); L.SUB = []; R.merged = true;
        W.PEER = (W.PEER || 0) + (W.SUB || 0); W.SUB = 0;
      }
      R.weights = W;
      REL_ORDER.forEach(function (rel) {
        var list = L[rel];
        var cats = [0, 1, 2, 3, 4].map(function (ci) { return r2(mean(list.map(function (x) { return x.cats[ci]; }).filter(function (x) { return x != null; }))); });
        R.groups[rel] = { n: list.length, cats: cats, score: r2(overall(cats)),
          hidden: rel !== 'SUP' && rel !== 'SELF' && list.length > 0 && list.length < minN };
        list.forEach(function (x) {
          if (rel === 'SELF') { R.selfComments = { strength: x.r.strength || '', improve: x.r.improve || '', other: x.r.other || '' }; return; }
          var tag = R.merged && rel === 'PEER' ? 'PEER' : rel;
          ['strength', 'improve', 'other'].forEach(function (k) { if (x.r[k]) R.comments[k].push({ rel: tag, text: x.r[k] }); });
        });
      });
      var cats360 = [0, 1, 2, 3, 4].map(function (ci) {
        var s = 0, w = 0;
        Object.keys(W).forEach(function (rel) { var g = R.groups[rel]; var v = g && g.cats[ci]; if (v != null && W[rel] > 0) { s += v * W[rel]; w += W[rel]; } });
        return w ? r2(s / w) : null;
      });
      var usedW = 0, totW = 0;
      Object.keys(W).forEach(function (rel) { totW += W[rel]; if (R.groups[rel] && R.groups[rel].n) usedW += W[rel]; });
      R.others = { cats: cats360, score: r2(overall(cats360)), n: ['SUP', 'PEER', 'SUB', 'PARTNER'].reduce(function (s, k) { return s + R.groups[k].n; }, 0), weightCoverage: totW ? Math.round(usedW / totW * 100) : 0 };
      R.band = bandOf(R.others.score, cats360);
      var ranked = cats360.map(function (v, ci) { return { ci: ci, v: v }; }).filter(function (x) { return x.v != null; });
      ranked.sort(function (a, b) { return b.v - a.v; });
      R.strengths = ranked.slice(0, 2).map(function (x) { return x.ci; });
      R.develop = ranked.slice(-2).reverse().map(function (x) { return x.ci; });
      // หาข้อย่อยที่สูง/ต่ำสุด (จากผู้อื่น ถ่วงน้ำหนัก)
      R.items = ITEM_KEYS.map(function (k) {
        var s = 0, w = 0;
        Object.keys(W).forEach(function (rel) {
          var v = L[rel].map(function (x) { return Number(x.r.answers[k]); }).filter(function (x) { return x >= 1 && x <= 5; });
          if (v.length && W[rel] > 0) { s += mean(v) * W[rel]; w += W[rel]; }
        });
        var sv = L.SELF.map(function (x) { return Number(x.r.answers[k]); }).filter(function (x) { return x >= 1 && x <= 5; });
        return { key: k, others: w ? r2(s / w) : null, self: sv.length ? sv[0] : null };
      });
      R.gaps = [0, 1, 2, 3, 4].map(function (ci) {
        var s = R.groups.SELF.cats[ci], o = cats360[ci];
        return (s == null || o == null) ? null : r2(s - o);
      });
    });
    return res;
  }

  function makePin() { return String(Math.floor(100000 + Math.random() * 900000)); }

  return {
    BRANCHES: BRANCHES, BRANCH_ORDER: BRANCH_ORDER, ROLES: ROLES, RATEE_ROLES: RATEE_ROLES, ROLE_RANK: ROLE_RANK,
    REL: REL, REL_SHORT: REL_SHORT, REL_ORDER: REL_ORDER, ROSTER: ROSTER, FORMS: FORMS, OPEN_Q: OPEN_Q,
    SCALE: SCALE, BANDS: BANDS, ITEM_KEYS: ITEM_KEYS, formOf: formOf, rosterObjects: rosterObjects, displayName: displayName,
    roleLabel: roleLabel, generateAssignments: generateAssignments, catScores: catScores, overall: overall,
    bandOf: bandOf, status: status, aggregate: aggregate, makePin: makePin
  };
})();

/* ---------------- demo backend (ใช้เฉพาะตอนเปิดนอก Google Apps Script) ---------------- */
var DEMO = (function(){

  var asg = C.generateAssignments(emps), resps = [];
  var cfg = { TITLE:'ประเมินผล 360 องศา ฝ่ายขาย ปี 2569', START:'2026-11-02', END:'2026-11-08', ADMIN_PASSWORD:'ris360hr', MIN_GROUP_N:2, MIN_SUB_N:3 };
  function byId(id){ return emps.filter(function(e){ return e.id === id; })[0]; }
  function auth(id, pin){ var e = byId(String(id).trim()); if (!e || e.pin !== String(pin).trim()) throw new Error('รหัสพนักงานหรือ PIN ไม่ถูกต้อง'); return e; }
  function pc(){ return { title:cfg.TITLE, start:cfg.START, end:cfg.END, open:true, phase:'open', today:'2026-11-04', mode:'OPEN' }; }
  function ts(){ var d = new Date(); return d.toISOString().slice(0,16).replace('T',' '); }
  function randomFill(rate){
    var done = {}; resps.forEach(function(r){ done[r.raterId+'>'+r.rateeId] = 1; });
    var bias = {}; emps.forEach(function(e){ bias[e.id] = { base: 3 + Math.random()*1.4, comp: [0,1,2,3,4].map(function(){ return (Math.random()-.5)*1.4; }) }; });
    var S1 = ['ทุ่มเทและเป็นแบบอย่างในการทำงาน','รับฟังลูกทีมและให้คำปรึกษาดี','ติดตามยอดขายใกล้ชิด ทำให้ทีมถึงเป้า','ประสานงานกับฝ่ายสินเชื่อได้รวดเร็ว','ใจเย็น แก้ปัญหาลูกค้าได้ดี'];
    var I1 = ['อยากให้ให้ Feedback บ่อยขึ้น','ควรวางแผนล่วงหน้าให้ชัดเจนกว่านี้','อยากให้สอนงานน้องใหม่มากขึ้น','สื่อสารนโยบายให้ทั่วถึงทุกคน','ควรจัดการความขัดแย้งในทีมให้เร็วขึ้น'];
    asg.forEach(function(a){
      if (done[a.raterId+'>'+a.rateeId] || Math.random() > rate) return;
      var b = bias[a.rateeId], lift = a.rel === 'SELF' ? .45 : a.rel === 'SUB' ? -.15 : 0, ans = {};
      C.ITEM_KEYS.forEach(function(k, idx){ var ci = Math.floor(idx / 3);
        var v = Math.round(b.base + b.comp[ci] + lift + (Math.random()-.5)*1.3); v = Math.max(1, Math.min(5, v));

          var t = byId(a.rateeId); return { rateeId:t.id, name:t.name, nick:t.nick, role:t.role, branch:t.branch, rel:a.rel, form:C.formOf(t.role), done:!!done[t.id], ts:done[t.id]||'' }; }) };
      }
      case 'getResponse': { var m2 = auth(q.id, q.pin); return resps.filter(function(r){ return r.raterId === m2.id && r.rateeId === q.rateeId; })[0] || null; }
      case 'submit': {
        var m3 = auth(q.id, q.pin), a = asg.filter(function(x){ return x.raterId === m3.id && x.rateeId === q.rateeId; })[0];

        resps = resps.filter(function(r){ return !(r.raterId === m3.id && r.rateeId === q.rateeId); });
        resps.push({ ts: ts(), raterId:m3.id, rateeId:q.rateeId, rel:a.rel, answers:q.answers, strength:q.strength, improve:q.improve, other:q.other });
        return { saved:true };
      }
      case 'admin': if (q.pw !== cfg.ADMIN_PASSWORD) throw new Error('รหัสผ่าน HR ไม่ถูกต้อง');
        return { employees: emps, assignments: asg, done: resps.map(function(r){ return [r.raterId, r.rateeId, r.ts]; }), cfg: pc(), url: 'https://script.google.com/macros/s/…/exec' };
      case 'report': if (q.pw !== cfg.ADMIN_PASSWORD) throw new Error('รหัสผ่าน HR ไม่ถูกต้อง');
        return { report: C.aggregate(emps, asg, resps, cfg), minN: 2 };
      case 'regenerate': asg = C.generateAssignments(emps); return { count: asg.length };
      case 'writeSummary': return { rows: 0, demo: true };
      case 'demoFill': randomFill(q.rate || .85); return { n: resps.length };

  }

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function thDate(iso){ if(!iso) return ''; var p = iso.split('-'); return Number(p[2]) + ' ' + THM[Number(p[1])-1] + ' ' + (Number(p[0]) + 543); }
function daysLeft(cfg){ var t = new Date(cfg.today+'T00:00:00'), e = new Date(cfg.end+'T00:00:00'); return Math.round((e - t)/864e5) + 1; }
function initials(name){ return (name || '?').trim().charAt(0); }
function f1(x){ return x == null ? '–' : (Math.round(x*100)/100).toFixed(2); }

function phaseChip(cfg){
  if (!cfg) return '';
  if (cfg.phase === 'open'){ var d = daysLeft(cfg); return '<span class="chip good">● เปิดรับแบบประเมิน · เหลือ ' + d + ' วัน</span>'; }
  if (cfg.phase === 'before') return '<span class="chip warn">ยังไม่เปิด · เริ่ม ' + thDate(cfg.start) + '</span>';
  return '<span class="chip bad">ปิดรับแบบประเมินแล้ว</span>';
}

/* ---------------- render ---------------- */
function render(){
  destroyCharts();
  var v = S.view, h = '';
  if (v === 'loading') h = '<div class="spin"></div>';
  else if (v === 'login') h = vLogin();
  else if (v === 'home') h = vHome();
  else if (v === 'form') h = vForm();
  else if (v === 'hrlogin') h = vHrLogin();
  else if (v === 'hr') h = vHr();
  document.getElementById('app').innerHTML = h + (IS_GAS ? '' : vDemo());
  if (v === 'hr' && S.hr.tab === 'report') mountReportCharts();
  window.scrollTo && v !== 'form' && 0;
}

function vLogin(){
  return '<div class="wrap" style="max-width:440px">' + header('Rayong Isuzu Sales') +
    '<div class="card"><h1>เข้าสู่แบบประเมิน</h1><p class="muted small" style="margin-top:0">ใช้รหัสพนักงานและ PIN 6 หลักที่ได้รับจาก HR (หรือกดลิงก์ส่วนตัวที่ HR ส่งให้)</p>' +
    (S.err ? '<div class="err">' + esc(S.err) + '</div>' : '') +
    '<form data-form="login"><label class="field"><span>รหัสพนักงาน</span><input class="input" name="empid" inputmode="numeric" autocomplete="username" required></label>' +
    '<label class="field"><span>PIN</span><input class="input" name="pin" inputmode="numeric" type="password" autocomplete="current-password" required></label>' +
    '<label class="row small" style="gap:8px;margin:-2px 0 12px"><input type="checkbox" name="remember" checked style="width:18px;height:18px"> จำการเข้าสู่ระบบไว้ในเครื่องนี้</label>' +
    '<button class="btn pri block" ' + (S.busy ? 'disabled' : '') + '>' + (S.busy ? 'กำลังตรวจสอบ…' : 'เข้าสู่ระบบ') + '</button></form></div>' +
    '<button class="btn block" data-act="install" style="margin-bottom:12px">📲 ติดตั้งเป็นแอปบนมือถือ</button>' +
    '<p class="xs" style="text-align:center">ข้อมูลของคุณจะถูกเก็บเป็นความลับ · <a href="#" data-act="go-hrlogin">สำหรับ HR</a></p></div>';
}

function vHome(){
  var t = S.tasks.slice(), done = t.filter(function(x){ return x.done; }).length, cfg = S.cfg;
  var relRank = { SELF:0, SUP:1, PEER:2, SUB:3 };
  t.sort(function(a, b){ return (a.done - b.done) || (relRank[a.rel] - relRank[b.rel]) || a.name.localeCompare(b.name, 'th'); });
  var me = S.me, pct = t.length ? Math.round(done / t.length * 100) : 0;
  var h = '<div class="wrap">' + header(C.ROLES[me.role] + ' · ' + branchName(me.branch), '<button class="btn sm" data-act="install" title="ติดตั้งเป็นแอป">📲 แอป</button><button class="btn sm ghost" data-act="logout">ออก</button>');
  h += '<div class="card hero"><div class="xs" style="margin-bottom:2px">สวัสดีค่ะ</div><h1>คุณ' + esc(me.nick || me.name.split(' ')[0]) + '</h1>' +
    '<div class="muted small">ช่วงประเมิน ' + thDate(cfg.start) + ' – ' + thDate(cfg.end) + '</div>' +
    '<div class="row" style="margin-top:14px"><div class="grow"><div class="bar"><i style="width:' + pct + '%"></i></div></div><b>' + done + '/' + t.length + '</b></div>' +
    '<div class="xs" style="margin-top:6px">' + (done === t.length && t.length ? 'ขอบคุณค่ะ คุณประเมินครบทุกคนแล้ว 🎉' : 'เหลือแบบประเมินอีก ' + (t.length - done) + ' ชุด · ใช้เวลาประมาณชุดละ 3 นาที') + '</div></div>';
  h += '<div style="margin-bottom:10px">' + phaseChip(cfg) + '</div>';
  if (!t.length) h += '<div class="card">ไม่มีรายการที่ต้องประเมินสำหรับคุณ</div>';
  t.forEach(function(x){
    var can = cfg.open;
    h += '<div class="task ' + (x.done ? 'done' : '') + '"><div class="av">' + esc(initials(x.name)) + '</div><div class="grow"><div class="nm">' +
      (x.rel === 'SELF' ? 'ประเมินตนเอง' : esc(x.name) + (x.nick ? ' <span class="muted" style="font-weight:400">(' + esc(x.nick) + ')</span>' : '')) + '</div>' +
      '<div class="xs">' + esc(C.ROLES[x.role]) + ' · ' + esc(branchName(x.branch)) + '</div>' +
      '<div style="margin-top:4px"><span class="chip rel-' + x.rel + '">' + (x.rel === 'SELF' ? 'ตนเอง' : 'คุณเป็น' + relAs(x.rel)) + '</span></div></div>' +
      (x.done ? '<div style="text-align:right"><div class="check">✓</div>' + (can ? '<button class="btn sm ghost" data-act="open" data-id="' + x.rateeId + '" style="margin-top:4px">แก้ไข</button>' : '') + '</div>'
        : '<button class="btn pri sm" data-act="open" data-id="' + x.rateeId + '" ' + (can ? '' : 'disabled') + '>ประเมิน</button>') + '</div>';
  });
  h += '<p class="xs" style="margin-top:16px">🔒 ผลจากเพื่อนร่วมงานและลูกทีมจะรายงานเป็นค่าเฉลี่ยของกลุ่ม ไม่ระบุชื่อผู้ประเมิน · ส่งแล้วยังแก้ไขได้จนถึงวันปิดรับ</p></div>';
  return h;
}
function relAs(rel){ return rel === 'SUP' ? 'หัวหน้าของเขา' : rel === 'PEER' ? 'เพื่อนร่วมงาน' : rel === 'SUB' ? 'ลูกน้องของเขา' : rel === 'PARTNER' ? 'หน่วยงานที่ทำงานร่วม' : ''; }

/* form */
function openForm(rateeId){
  var task = S.tasks.filter(function(t){ return t.rateeId === rateeId; })[0];
  S.form = { task: task, form: formFor(task.role), answers: {}, step: -1, strength: '', improve: '', other: '', loading: task.done };
  var dr = loadDraft();
  if (dr && !task.done){ S.form.answers = dr.a || {}; S.form.strength = dr.s || ''; S.form.improve = dr.i || ''; S.form.other = dr.o || ''; }
  S.view = 'form'; render(); window.scrollTo(0, 0);
  if (task.done){
    call({ action:'getResponse', id:S.me.id, pin:S.pin, rateeId:rateeId }).then(function(r){
      if (r){ S.form.answers = r.answers; S.form.strength = r.strength; S.form.improve = r.improve; S.form.other = r.other || ''; }
      S.form.loading = false; render();
    }, function(e){ S.form.loading = false; toast(e.message); render(); });
  }
}
function stepCount(){ return 5 + 2; } // 5 หมวด + คำถามปลายเปิด + ตรวจทาน
function catDone(ci){ var c = S.form.form.cats[ci]; for (var i = 1; i <= 3; i++){ var v = S.form.answers[c.code + i]; if (v === undefined || v === null || v === '') return false; } return true; }

    '<li>ตั้งชื่อ <b>RIS 360</b> แล้วกด <b>เพิ่ม</b> — ไอคอนจะอยู่บนหน้าจอเหมือนแอปทั่วไป</li></ol>';
  var and = '<ol class="small" style="padding-left:20px;margin:6px 0 0">' +
    '<li>เปิดลิงก์นี้ด้วย <b>Chrome</b> (ถ้าเปิดจาก LINE ให้กด ⋮ → <b>เปิดในเบราว์เซอร์</b>)</li>' +
    '<li>กดเมนู <b>⋮</b> มุมขวาบน</li>' +
    '<li>เลือก <b>เพิ่มลงในหน้าจอหลัก</b> (Add to Home screen) หรือ <b>ติดตั้งแอป</b></li>' +
    '<li>ตั้งชื่อ <b>RIS 360</b> แล้วกด <b>เพิ่ม</b></li></ol>';
  modal('<h2>📲 ติดตั้ง RIS 360 เป็นแอปบนมือถือ</h2><p class="small muted" style="margin-top:0">ไม่ต้องดาวน์โหลดจาก App Store / Play Store · เพิ่มครั้งเดียว ครั้งต่อไปแตะไอคอนแล้วเข้าหน้าประเมินของคุณได้ทันที</p>' +
    '<div class="seg" style="margin-bottom:8px"><button class="' + (which === 'ios' ? 'on' : '') + '" data-act="guide" data-w="ios">iPhone / iPad</button><button class="' + (which === 'android' ? 'on' : '') + '" data-act="guide" data-w="android">Android</button></div>' +
    (which === 'ios' ? ios : and) +
    '<div class="box" style="margin-top:12px"><div class="small">💡 ระบบจำการเข้าสู่ระบบไว้ในเครื่องนี้แล้ว แตะไอคอนครั้งต่อไปจะเข้าหน้ารายการประเมินของคุณเลย ไม่ต้องกรอก PIN ซ้ำ</div></div>' +
    '<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" data-act="modal-close">เข้าใจแล้ว</button></div>');
}
function maybeInstallTip(){
  try { if (localStorage.getItem('ris360_tip')) return; localStorage.setItem('ris360_tip', '1'); } catch(e){ return; }
  if (platform() !== 'desktop') setTimeout(function(){ installGuide(); }, 500);
}
function refreshTasks(){ return call({ action:'login', id:S.me.id, pin:S.pin }).then(function(d){ S.tasks = d.tasks; S.cfg = d.cfg; }); }
function doHr(pw){
  S.busy = true; S.err = ''; if (S.view !== 'hr') render();
  return Promise.all([call({ action:'admin', pw:pw }), call({ action:'report', pw:pw })]).then(function(r){
    S.busy = false; S.hr.pw = pw; S.hr.data = r[0]; S.hr.report = r[1]; S.cfg = r[0].cfg; S.view = 'hr'; render();
  }, function(e){ S.busy = false; S.err = e.message; S.view = 'hrlogin'; render(); });
}

document.addEventListener('submit', function(ev){
  var f = ev.target; ev.preventDefault();
  if (f.dataset.form === 'login') doLogin(f.elements['empid'].value.trim(), f.elements['pin'].value.trim(), f.elements['remember'].checked);
  if (f.dataset.form === 'hr') doHr(f.elements['pw'].value);
});
document.addEventListener('input', function(ev){
  var t = ev.target, k = t.dataset && t.dataset.in; if (!k) return;
  if (k === 'strength' || k === 'improve' || k === 'other'){ S.form[k] = t.value; saveDraft(); }
  if (k === 'q'){ S.hr.q = t.value; var pos = t.selectionStart; render(); var n = document.querySelector('[data-in="q"]'); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(e){} } }
});
document.addEventListener('change', function(ev){
  var t = ev.target, k = t.dataset && t.dataset.in; if (!k) return;
  if (k === 'branch'){ S.hr.branch = t.value; render(); }
  if (k === 'demo-as' && t.value){ S.demoOpen = false; var e = DEMO.emps.filter(function(x){ return x.id === t.value; })[0]; doLogin(e.id, e.pin); }
});
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var a = b.dataset.act;
  if (a === 'modal-close-bg'){ if (ev.target === b) closeModal(); return; }
  if (b.tagName === 'A') ev.preventDefault();
  var F = S.form;
  switch(a){
    case 'modal-close': closeModal(); break;
    case 'install': installGuide(); break;
    case 'guide': installGuide(b.dataset.w); break;
    case 'go-hrlogin': S.err = ''; S.view = 'hrlogin'; render(); break;
    case 'go-login': S.err = ''; S.view = 'login'; render(); break;
    case 'logout': clearLogin(); S.me = null; S.pin = ''; S.hr.pw = ''; S.hr.data = null; S.view = 'login'; render(); break;
    case 'open': openForm(b.dataset.id); break;
    case 'back-home': S.view = 'home'; render(); break;
    case 'step': F.step = Math.max(-1, Math.min(stepCount() - 1, F.step + Number(b.dataset.d))); render(); window.scrollTo(0, 0); break;
    case 'goto': F.step = Number(b.dataset.s); render(); window.scrollTo(0, 0); break;
    case 'ans': {
      F.answers[b.dataset.k] = Number(b.dataset.v); saveDraft();
      var y = window.scrollY; render(); window.scrollTo(0, y); break;
    }
    case 'submit': {
      S.busy = true; render();
      call({ action:'submit', id:S.me.id, pin:S.pin, rateeId:F.task.rateeId, answers:F.answers, strength:F.strength, improve:F.improve, other:F.other }).then(function(){
        clearDraft(); return refreshTasks();
      }).then(function(){ S.busy = false; S.view = 'home'; render(); window.scrollTo(0, 0); toast('ส่งแบบประเมินเรียบร้อย ขอบคุณค่ะ'); },
        function(e){ S.busy = false; render(); modal('<h2>ส่งไม่สำเร็จ</h2><p>' + esc(e.message) + '</p><div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="modal-close">ตกลง</button></div>'); });
      break;
    }
    case 'tab': S.hr.tab = b.dataset.t; render(); break;
    case 'filter': S.hr.filter = b.dataset.f; render(); break;
    case 'sel': S.hr.sel = b.dataset.id; render(); break;
    case 'hr-refresh': doHr(S.hr.pw).then(function(){ toast('อัปเดตข้อมูลล่าสุดแล้ว'); }); break;
    case 'copy-link': { var M = hrModel(), e = M.byId[b.dataset.id]; copyText(linkMsg(e, M), 'คัดลอกข้อความ + ลิงก์ของ ' + (e.nick || e.name) + ' แล้ว'); break; }
    case 'copy-all-links': {
      var M2 = hrModel(), rows = ['รหัส\tชื่อ-สกุล\tชื่อเล่น\tสาขา\tตำแหน่ง\tจำนวนชุด\tPIN\tลิงก์ส่วนตัว'];
      Object.keys(M2.st.raters).forEach(function(id){ var e = M2.byId[id]; rows.push([e.id, e.name, e.nick, branchName(e.branch), C.ROLES[e.role], M2.st.raters[id].total, e.pin, personalLink(e)].join('\t')); });
      copyText(rows.join('\n'), 'คัดลอกรายการลิงก์แล้ว วางใน Excel/Sheet ได้เลย'); break;
    }
    case 'copy-remind': {
      var M3 = hrModel(), cfg = S.hr.data.cfg, by = {};
      Object.keys(M3.st.raters).forEach(function(id){ var r = M3.st.raters[id]; if (r.done < r.total){ var e = M3.byId[id]; (by[e.branch] = by[e.branch] || []).push((e.nick ? 'คุณ' + e.nick : e.name) + ' (เหลือ ' + (r.total - r.done) + ' ชุด)'); } });
      var txt = '📣 แจ้งเตือนแบบประเมิน 360 องศา ฝ่ายขาย\nปิดรับ ' + thDate(cfg.end) + (cfg.phase === 'open' ? ' (เหลือ ' + daysLeft(cfg) + ' วัน)' : '') + '\nรายชื่อที่ยังประเมินไม่ครบ:\n';
      C.BRANCH_ORDER.forEach(function(bk){ if (by[bk]) txt += '\n▪️ ' + branchName(bk) + '\n' + by[bk].map(function(s){ return '   - ' + s; }).join('\n') + '\n'; });
      txt += '\nกรุณาเข้าลิงก์ส่วนตัวที่ HR ส่งให้ ขอบคุณค่ะ 🙏';
      copyText(txt, 'คัดลอกข้อความเตือนแล้ว'); break;
    }
    case 'regen': confirmBox('สร้างคู่ประเมินใหม่?', 'ระบบจะเขียนทับชีต Assignments ตามกติกาอัตโนมัติจากรายชื่อปัจจุบัน (คำตอบที่ส่งแล้วไม่หาย) — ถ้าเคยแก้คู่ประเมินเองในชีต การแก้ไขนั้นจะหายไป', 'สร้างใหม่', function(){
      call({ action:'regenerate', pw:S.hr.pw }).then(function(r){ toast('สร้างแล้ว ' + r.count + ' คู่'); return doHr(S.hr.pw); }, function(e){ toast(e.message); }); }); break;
    case 'write-summary': call({ action:'writeSummary', pw:S.hr.pw }).then(function(r){ toast('บันทึกลงชีต Summary แล้ว (' + r.rows + ' แถว)'); }, function(e){ toast(e.message); }); break;
    case 'print-all': printAll(); break;
    case 'demo-toggle': S.demoOpen = !S.demoOpen; render(); break;
    case 'demo-hr': S.demoOpen = false; doHr('ris360hr'); break;
    case 'demo-fill': call({ action:'demoFill', rate:.85 }).then(function(){ toast('สุ่มคำตอบตัวอย่างแล้ว'); if (S.view === 'hr') doHr(S.hr.pw); else if (S.me) refreshTasks().then(render); }); break;
    case 'demo-reset': call({ action:'demoReset' }).then(function(){ toast('ล้างคำตอบแล้ว'); if (S.view === 'hr') doHr(S.hr.pw); else if (S.me) refreshTasks().then(render); }); break;
  }
});

/* ---------------- start ---------------- */
function start(params){
  params = params || {};
  if (params.u && params.k) doLogin(String(params.u), String(params.k));
  else if (params.hr !== undefined) { S.view = 'hrlogin'; render(); }
  else { var sv = loadLogin(); if (sv && sv.id && sv.pin) doLogin(sv.id, sv.pin); else { S.view = 'login'; render(); } }
}
if (IS_GAS && google.script.url) google.script.url.getLocation(function(loc){ start(loc.parameter); });
else start({});
})();
</script>
</body>
